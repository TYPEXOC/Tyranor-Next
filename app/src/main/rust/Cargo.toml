[package]
name = "tyn-translation-data-decoder"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[lib]
name = "translation_data_decoder"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.21.1"
encoding_rs = "0.8.44"
rpgmad-lib = "7.0.0"
rvpacker-txt-rs-lib = "19.0.1"
serde_json = "1.0.154"

[profile.release]
opt-level = 3
strip = true
lto = true
codegen-units = 1
